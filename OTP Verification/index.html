
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mobile OTP Verification</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <div class="card" id="mobileSection">

            <div class="icon">
                📱
            </div>

            <h1>
                Verify Mobile
            </h1>

            <p>
                Enter your mobile number to receive
                a verification code.
            </p>


            <form id="mobileForm">

                <div class="phone-input">

                    <span>
                        +91
                    </span>

                    <input
                        type="tel"
                        id="mobileNumber"
                        placeholder="9876543210"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>


                <p
                    id="mobileError"
                    class="error"
                ></p>


                <button type="submit">
                    Generate OTP
                </button>

            </form>

        </div>



        <div
            class="card hidden"
            id="otpSection"
        >

            <div class="icon">
                🔐
            </div>

            <h1>
                Enter OTP
            </h1>

            <p>
                OTP sent to
                <strong id="displayNumber">
                </strong>
            </p>


            <form id="otpForm">

                <div class="otp-container">

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    >

                </div>


                <p
                    id="otpMessage"
                    class="message"
                ></p>


                <button
                    type="submit"
                    id="verifyBtn"
                >
                    Verify OTP
                </button>

            </form>


            <div class="timer">

                <span id="timerText">
                    Resend OTP in
                    <strong>45s</strong>
                </span>

            </div>


            <button
                id="resendBtn"
                class="resend"
                disabled
            >
                Resend OTP
            </button>

        </div>



        <div
            class="card hidden"
            id="successSection"
        >

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Verified Successfully
            </h1>

            <p>
                Your mobile number has been
                verified successfully.
            </p>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
