<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr>

    <form> 


  
    <h2>Personal Details</h2>

    <label for="fname">First Name: </label>
    <input type="text" name="userName" id="fname" placeholder="e.g., Arjun" required>
    <br>
    <br>
    <label for="lname">Last Name: </label>
    <input type="text" name="userName" id="lname" placeholder="e.g., Kumar" required>
    <br>
    <br>
    <label for="birth">Date of Birth: </label>
    <input type="date">
    <br>
    <br>
    <label for="gender">Gender:</label>
    <br>
    <input type="radio" name="gender" id="male" value="male">
    <label for="male">Male</label>
    <br>
    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    <br>
    <input type="radio" name="gender" id="other" value="other">
    <label for="other">Other</label>
    <br><br>
    <label for="Upload">Upload Your Photo: </label>
    <br>
    <input type="file">
    <br><br>
    <hr>

    <h2>Contact Information</h2>
    <label for="email">Email Address: </label>
    <input type="email" name="useremail" id="email" placeholder="you@gmail.com" required>
    <br>
    <br>
    <label for="phone">Phone Number: </label>
    <input type="number" name="userphone" id="phone" placeholder="e.g.,4578458787" required>
    <br><br>
    <label for="address">Mailing Address: </label>
    <br>
    <textarea name="Address" id="address" placeholder="Street Address, City, State, ZIP Code"></textarea>
    <br>
    <br>
    <hr>

    <h2>Academic Information</h2>
    <label for="course">Select Your Course: </label>
    <br>
    <select name="course" id="course">
        <option value="C++" >C++</option>
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="JavaScript">javaScript</option>
    </select>

    <br>
    <br>
    <label>Extracurricular Interests: </label>
    <br>
    <input type="checkbox" name="interests" id="sport">
    <label for="sport">Sports</label>
    <br>
    <input type="checkbox" name="interests" id="music">
    <label for="music">Music & Arts</label>
    <br>
    <input type="checkbox" name="interests" id="clubs">
    <label for="clubs">technology Clubs</label>
    <br>
    <input type="checkbox" name="interests" id="volunteering">
    <label for="volunteering">Volunteering</label>
    <br><br>
    <hr>
    <h2>Create Your Account</h2>
    <label for="password">Create a Password: </label>
    <input type="text" name="username" id="password">
    <br>
    <br>
    <label for="security">Security Question: </label>
    <select name="ques" id="security">
        <option value="pet" >what was your first pet name?</option>
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="JavaScript">javaScript</option>
    </select>
    <br>
    <br>
    <label for="answer">Security Answer: </label>
    <input type="text" name="userans" id="answer">
    <br>
    <br>
    <input type="checkbox" name="useragree" id="agree">
    <label for="agree">I agree to the Terms and Conditions.</label>
    <br><br>
    <hr>

    <button type="submit">Register</button>
    <button type="reset">Clear Form</button>
    

      </form>
</body>
</html>
